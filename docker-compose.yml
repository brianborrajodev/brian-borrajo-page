services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    command: ["postgres", "-p", "${POSTGRES_PORT:?Define POSTGRES_PORT en .env}"]
    ports:
      - "${POSTGRES_EXPOSED_PORT:?Define POSTGRES_EXPOSED_PORT en .env}:${POSTGRES_PORT:?Define POSTGRES_PORT en .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h ${POSTGRES_HEALTHCHECK_HOST:?Define POSTGRES_HEALTHCHECK_HOST en .env} -p ${POSTGRES_PORT:?Define POSTGRES_PORT en .env} -U ${POSTGRES_USER:?Define POSTGRES_USER en .env} -d ${POSTGRES_DB:?Define POSTGRES_DB en .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./src/backend
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_EXPOSED_PORT:?Define BACKEND_EXPOSED_PORT en .env}:${FLASK_RUN_PORT:?Define FLASK_RUN_PORT en .env}"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src/backend
          target: /app
          initial_sync: true
          ignore:
            - __pycache__/
            - requirements.txt
        - action: rebuild
          path: ./src/backend/requirements.txt

  # Servicios de herramientas: no arrancan con `docker compose up`
  migrate:
    build: ./src/backend
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./src/backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["flask", "--app", "app:app", "db", "migrate"]

  upgrade:
    build: ./src/backend
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./src/backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["flask", "--app", "app:app", "db", "upgrade"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:?Define VITE_API_URL en .env}
      VITE_HOST: ${VITE_HOST:?Define VITE_HOST en .env}
      VITE_PORT: ${VITE_PORT:?Define VITE_PORT en .env}
    ports:
      - "${FRONTEND_EXPOSED_PORT:?Define FRONTEND_EXPOSED_PORT en .env}:${VITE_PORT:?Define VITE_PORT en .env}"
    develop:
      watch:
        - action: sync
          path: ./src/frontend
          target: /app/src/frontend
          initial_sync: true
        - action: sync
          path: ./public
          target: /app/public
          initial_sync: true
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./vite.config.js

volumes:
  pgdata:
